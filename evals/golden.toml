# Golden turns: real production turns from the mini's Claude Code transcripts,
# picked 2026-11-01 from a catalogue of ~4,400 recorded turns. Only ids here;
# the captured content (prompts, replies, memory snapshots) lives in
# ~/.estate-brain/cases/ and is never committed.
#
# contract: wrapper-json  final reply is a JSON action {action, message, ...}
#           wrapper-any   JSON action or plain text (heartbeats, reflections)
#           door          Sentinel verdict, text starting "DOOR: <decision>"
#           structured    StructuredOutput (Bastion/Observatory --json-schema)
#           bare-json     JSON object in the reply text, no tools
# expect:   tool families the original turn used and a replay should too
#           ("edit:memory", "mcp:<server>", "web")

[defaults]
host = "mini"
remote_base = "/Users/urban/Public"
local_base = "/Volumes/Work/development/projects/git"

# Turns whose reference ACTED through the shell (Jarvis is an admin bot:
# calendar bookings via bin/calctl, mail) are never golden cases: a faithful
# replay would act again. Replays run without shell, mail or live estate
# access; the Claude control runs under the same conditions.

[[case]]
id = "jarvis-memory"
repo = "the-armory"
transcript = "ae46ae0c-563b-4b99-af9a-eaf9cdb6bf93"
contract = "wrapper-json"

